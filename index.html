<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>San Valentín</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background: linear-gradient(-45deg,#ff8fab,#ff758c,#ff9fb2,#ff8fab);
    background-size:400% 400%;
    animation:fondo 12s ease infinite;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
}

@keyframes fondo{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.card{
    width:90%;
    max-width:700px;
    background:rgba(255,255,255,0.25);
    backdrop-filter: blur(15px);
    padding:40px 25px;
    border-radius:30px;
    text-align:center;
    color:white;
    box-shadow:0 0 40px rgba(0,0,0,0.25);
    animation:entrada 1.2s ease;
}

@keyframes entrada{
    from{opacity:0; transform:scale(.8)}
    to{opacity:1; transform:scale(1)}
}

h1{
    font-size:2em;
    margin-bottom:15px;
}

p{
    font-size:1.2em;
    margin-bottom:25px;
}

.botones{
    margin-top:20px;
}

button{
    border:none;
    padding:15px 35px;
    margin:10px;
    font-size:1.2em;
    border-radius:50px;
    cursor:pointer;
    transition:.3s;
}

.si{
    background:#ff4d6d;
    color:white;
}
.si:hover{transform:scale(1.1);}

.no{
    background:#eee;
    color:#ff4d6d;
    font-weight:bold;
}
.no:hover{transform:scale(1.1);}

#mensaje{
    margin-top:20px;
    font-size:1.3em;
    font-weight:bold;
}

.corazon{
    position:absolute;
    color:white;
    font-size:18px;
    animation:flotar linear infinite;
}

@keyframes flotar{
    from{transform:translateY(100vh);opacity:1}
    to{transform:translateY(-10vh);opacity:0}
}
</style>
</head>

<body>

<div class="card">
<h1>💖 Dulcesito de mi corazón ¿Te gustaría ser mi San Valentín? 💖</h1>

<p>
¡Me encantaría que aceptaras! Prometo abrazos y muchos momentos bonitos 🌹
</p>

<div class="botones">
<button class="si" onclick="si()">Sí 💘</button>
<button class="no" onclick="no()">No 😳</button>
</div>

<div id="mensaje"></div>
</div>

<script>
function si(){
document.getElementById("mensaje").innerHTML="💞 Sabía que dirías que sí 💞";
}
function no(){
document.getElementById("mensaje").innerHTML="😳 Mmm… ¿Segura? intenta otra vez jeje";
}

function crearCorazon(){
const c=document.createElement("div");
c.classList.add("corazon");
c.innerHTML="❤";
c.style.left=Math.random()*100+"vw";
c.style.animationDuration=(Math.random()*3+2)+"s";
document.body.appendChild(c);
setTimeout(()=>c.remove(),5000);
}
setInterval(crearCorazon,400);
</script>

</body>
</html>
