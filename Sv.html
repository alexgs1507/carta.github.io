<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>¿Quieres ser mi San Valentín?</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',sans-serif;
    background: linear-gradient(-45deg,#ff758c,#ff7eb3,#ffb199,#ff758c);
    background-size:400% 400%;
    animation: fondo 12s ease infinite;
    overflow:hidden;
}

/* Fondo animado */
@keyframes fondo{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* Tarjeta */
.card{
    background:rgba(255,255,255,0.2);
    backdrop-filter: blur(15px);
    padding:45px;
    border-radius:30px;
    text-align:center;
    color:white;
    box-shadow:0 0 40px rgba(0,0,0,0.25);
    animation: entrada 1.5s ease;
}

/* Animación entrada */
@keyframes entrada{
    from{opacity:0; transform:scale(0.7)}
    to{opacity:1; transform:scale(1)}
}

h1{
    font-size:2.7em;
    margin-bottom:10px;
    text-shadow:0 0 15px rgba(255,255,255,0.8);
}

p{
    font-size:1.8em;
    margin-bottom:25px;
}

/* Botones */
button{
    border:none;
    padding:15px 35px;
    margin:12px;
    font-size:1.2em;
    border-radius:50px;
    cursor:pointer;
    transition:.3s;
    position:relative;
}

/* Sí */
.si{
    background:#ff4d6d;
    color:white;
    box-shadow:0 0 50px #ff4d6d;
}
.si:hover{
    transform:scale(1.15);
    box-shadow:0 0 30px #ff4d6d;
}

/* No */
.no{
    background:white;
    color:#ff4d6d;
    font-weight:bold;
}
.no:hover{
    transform:translateX(10px);
}

/* Corazones flotando */
.corazon{
    position:absolute;
    color:white;
    font-size:20px;
    animation: flotar linear infinite;
}
@keyframes flotar{
    from{transform:translateY(100vh); opacity:1}
    to{transform:translateY(-10vh); opacity:0}
}

/* Mensaje */
#mensaje{
    margin-top:20px;
    font-size:1.4em;
    font-weight:bold;
    animation: latido 1s infinite;
}
@keyframes latido{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.1)}
}
</style>
</head>

<body>

<div class="card">
    <h1>💖 Dulcesito de mi corazón ¿Te gustaria ser mi San Valentín? 💖</h1>
    <p>¡Me encanatria que aceptaras! Prometo abrazos y muchos momentos bonitos 🌹 <br>
        Pdt: la pagina que hice esta diseñada para que el boton que elijas sea el que tu quieres.
    </p>

    <button class="si" onclick="si()">Sí 💘</button>
    <button class="no" onmouseover="mover(this)">No 😳</button>

    <div id="mensaje"></div>
</div>

<script>
function si(){
    document.getElementById("mensaje").innerHTML =
    "✨ ¡Sabía que dirías que sí! 💞 ✨";
}

/* Botón No escapa */
function mover(btn){
    btn.style.position="absolute";
    btn.style.top=Math.random()*80+"%";
    btn.style.left=Math.random()*80+"%";
}

/* Crear corazones */
function crearCorazon(){
    const corazon=document.createElement("div");
    corazon.classList.add("corazon");
    corazon.innerHTML="❤";
    corazon.style.left=Math.random()*100+"vw";
    corazon.style.animationDuration=(Math.random()*3+2)+"s";
    document.body.appendChild(corazon);

    setTimeout(()=>{corazon.remove()},5000);
}
setInterval(crearCorazon,300);
</script>

</body>
</html>
